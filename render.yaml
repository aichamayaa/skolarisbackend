# Backend API + base PostgreSQL gratuite
databases:
  - name: skolaris-db
    plan: free
    databaseName: skolaris

services:
  - type: web
    name: skolaris-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: skolaris-db
          property: connectionString
      # A remplir apres le deploiement du front (ex: https://skolaris-front.onrender.com)
      - key: FrontendUrl
        sync: false
